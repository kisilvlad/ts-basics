<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стартова сторінка | Шаблон</title>
  <!-- External W3.CSS and fonts from the W3Schools template -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <!-- Local CSS for modal and other custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation bar adapted from the W3.CSS start page template -->
<div class="w3-top">
  <div class="w3-bar w3-red w3-card w3-left-align w3-large">
    <a class="w3-bar-item w3-button w3-hide-medium w3-hide-large w3-right w3-padding-large w3-hover-white w3-large w3-red" href="javascript:void(0);" onclick="toggleMenu()" title="Toggle Navigation Menu"><i class="fa fa-bars"></i></a>
    <a href="#" class="w3-bar-item w3-button w3-padding-large w3-white">Головна</a>
    <a href="#posts" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">Пости</a>
    <!-- Button that opens the modal -->
    <a href="javascript:void(0);" id="openModal" class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white">Відкрити модальне</a>
  </div>
  <!-- Navbar on small screens -->
  <div id="navDemo" class="w3-bar-block w3-white w3-hide w3-hide-large w3-hide-medium w3-large">
    <a href="#posts" class="w3-bar-item w3-button w3-padding-large">Пости</a>
    <a href="javascript:void(0);" id="openModalSmall" class="w3-bar-item w3-button w3-padding-large">Відкрити модальне</a>
  </div>
</div>

<!-- Header section from W3.CSS template -->
<header class="w3-container w3-red w3-center" style="padding:128px 16px">
  <h1 class="w3-margin w3-jumbo">Стартова сторінка</h1>
  <p class="w3-xlarge">Шаблон від w3.css</p>
  <button class="w3-button w3-black w3-padding-large w3-large w3-margin-top" id="openModalButton">Почати</button>
</header>

<!-- Main content area where posts will be displayed -->
<main>
  <section id="posts" class="w3-container w3-padding-64">
    <h2>Останні пости</h2>
    <div id="postsContainer"></div>
  </section>
</main>

<!-- Modal structure -->
<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close-button" id="closeModal">&times;</span>
    <h2>Модальне вікно</h2>
    <p>Це демонстраційний текст модального вікна. Прокрутіть вниз, щоб побачити пости, завантажені з JSONPlaceholder.</p>
  </div>
</div>

<!-- Compiled JavaScript file produced from TypeScript -->
<script src="dist/script.js"></script>
<!-- Toggle menu function from the W3.CSS template to handle navigation on mobile -->
<script>
function toggleMenu() {
  var x = document.getElementById("navDemo");
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
  } else {
    x.className = x.className.replace(" w3-show", "");
  }
}
</script>
</body>
</html>
